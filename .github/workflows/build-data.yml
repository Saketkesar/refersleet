name: Build Data Index & Publish API

on:
  push:
    branches: [main]
    paths:
      - 'referrals/**'
      - 'categories/**'
      - 'contributors/**'
      - 'schema/**'
      - 'scripts/**'

jobs:
  build:
    name: Rebuild Indexes & Static API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Data Pipeline
        run: npm run pipeline

      - name: Commit & Push Updated Generated Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): auto-generate updated JSON indexes [skip ci]"
          file_pattern: "generated/*.json"
