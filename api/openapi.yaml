openapi: 3.0.3
info:
  title: Refersleet Public Data API
  description: |
    Free, community-powered public API providing structured referral programs, reward codes, and developer perks.
  version: 1.0.0
  contact:
    name: Saket Kesar
    url: https://github.com/Saketkesar/refersleet
    email: kesarsaket607@gmail.com
servers:
  - url: https://raw.githubusercontent.com/Saketkesar/refersleet/main/generated
    description: GitHub Raw CDN Feed
paths:
  /referrals.json:
    get:
      summary: Get all active referral programs
      description: Returns a list of all active verified referral programs.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Referral'
  /categories.json:
    get:
      summary: Get all categories
      responses:
        '200':
          description: Successful response
  /stats.json:
    get:
      summary: Get platform summary statistics
      responses:
        '200':
          description: Successful response
components:
  schemas:
    Referral:
      type: object
      required:
        - id
        - name
        - slug
        - status
        - reward
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
        reward:
          type: object
